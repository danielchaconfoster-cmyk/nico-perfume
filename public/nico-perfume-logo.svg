<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240">
  <rect width="800" height="240" fill="none" />
  
  <!-- Central Emblem / Monogram NP Crest -->
  <g transform="translate(400, 50)" text-anchor="middle">
    <!-- Diamond Frame -->
    <path d="M 0 -35 L 35 0 L 0 35 L -35 0 Z" fill="none" stroke="#000000" stroke-width="3" />
    <path d="M 0 -26 L 26 0 L 0 26 L -26 0 Z" fill="none" stroke="#000000" stroke-width="1.5" />
    <!-- Perfume Droplet / Crown -->
    <circle cx="0" cy="0" r="8" fill="#000000" />
    <path d="M -8 -8 C -4 -18, 4 -18, 8 -8 Z" fill="#000000" />
  </g>

  <!-- Luxury Brand Typography: NICO PERFUME -->
  <text
    x="400"
    y="145"
    text-anchor="middle"
    font-family="'Playfair Display', 'Cinzel', 'Georgia', serif"
    font-size="52"
    font-weight="700"
    letter-spacing="12"
    fill="#000000"
  >
    NICO PERFUME
  </text>

  <!-- Subtitle: ALTA PERFUMERÍA ORIGINAL -->
  <text
    x="400"
    y="190"
    text-anchor="middle"
    font-family="'Inter', 'Montserrat', sans-serif"
    font-size="14"
    font-weight="600"
    letter-spacing="8"
    fill="#000000"
  >
    ALTA PERFUMERÍA • CHILE
  </text>
</svg>
